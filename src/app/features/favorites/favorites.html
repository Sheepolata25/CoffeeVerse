<div class="flex flex-col gap-4 h-[calc(100vh-2.5rem)]">

  <!-- Top bar: search + user info -->
  <div class="flex gap-6 shrink-0">

    <div class="flex-1 card flex items-center gap-4 py-3 bg-surface p-4 rounded-2xl shadow-soft">
      <svg class="w-5 h-5 shrink-0 text-text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input type="text" placeholder="Search your favorites..."
        class="bg-transparent outline-none flex-1 placeholder-text-secondary text-text-primary text-sm" />
    </div>

    <a routerLink="/profile" class="w-72 shrink-0 card flex items-center gap-3 cursor-pointer">
      <div class="w-12 h-12 rounded-full bg-primary-soft flex items-center justify-center shrink-0 overflow-hidden">
        @if (profile()?.avatar_url) {
          <img [src]="profile()!.avatar_url" [alt]="profile()!.username" class="w-full h-full object-cover" />
        } @else {
          <svg class="w-6 h-6 text-text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        }
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-0.5">
          <span class="font-semibold text-text-primary">{{ profile()?.username }}</span>
          <span class="bg-primary-soft text-primary text-xs font-medium px-2 py-0.5 rounded-full">
            {{ profile()?.badge }}
          </span>
        </div>
        <p class="text-sm text-text-secondary truncate">{{ profile()?.bio || 'Coffee enthusiast ☕' }}</p>
      </div>
      <svg class="w-5 h-5 text-text-secondary shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </a>

  </div>

  <!-- Content -->
  <div class="flex gap-6 flex-1 min-h-0">

    <!-- Main column: collections + posts feed -->
    <div class="flex-1 min-h-0 flex flex-col gap-4">

      <!-- Collections -->
      <div class="card shrink-0 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <h2 class="font-semibold text-text-primary">My Collections</h2>
          <button class="flex items-center gap-1.5 text-xs font-medium text-primary hover:text-primary/80 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            New collection
          </button>
        </div>

        <div class="flex gap-2 flex-wrap">
          <button class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-primary text-white text-sm font-medium transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
            </svg>
            All saved
          </button>
          <button class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-background text-text-secondary text-sm font-medium hover:bg-primary-soft hover:text-primary transition-colors">
            Recipes
          </button>
          <button class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-background text-text-secondary text-sm font-medium hover:bg-primary-soft hover:text-primary transition-colors">
            Equipment
          </button>
        </div>
      </div>

      <!-- Saved posts feed -->
      <div class="flex-1 min-h-0 overflow-y-auto flex flex-col gap-4 pb-2 px-2">

        <div class="card flex flex-col gap-3 bg-surface shadow-soft p-4 rounded-2xl">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-primary-soft"></div>
              <div class="h-3 w-24 bg-background rounded-full"></div>
            </div>
            <div class="h-3 w-16 bg-background rounded-full"></div>
          </div>
          <div class="flex gap-3">
            <div class="w-36 h-36 shrink-0 rounded-xl bg-background"></div>
            <div class="flex-1 flex flex-col gap-2">
              <div class="h-4 w-3/4 bg-background rounded-full"></div>
              <div class="h-3 w-full bg-background rounded-full"></div>
              <div class="h-3 w-5/6 bg-background rounded-full"></div>
              <div class="h-3 w-2/3 bg-background rounded-full"></div>
            </div>
          </div>
          <div class="pt-2 border-t border-background flex items-center gap-2">
            <div class="h-7 w-16 bg-background rounded-xl"></div>
            <div class="h-7 w-16 bg-background rounded-xl"></div>
            <div class="h-7 w-16 bg-background rounded-xl"></div>
          </div>
        </div>

        <div class="card flex flex-col gap-3 bg-surface shadow-soft p-4 rounded-2xl">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-primary-soft"></div>
              <div class="h-3 w-20 bg-background rounded-full"></div>
            </div>
            <div class="h-3 w-16 bg-background rounded-full"></div>
          </div>
          <div class="flex gap-3">
            <div class="flex-1 flex flex-col gap-2">
              <div class="h-4 w-1/2 bg-background rounded-full"></div>
              <div class="h-3 w-full bg-background rounded-full"></div>
              <div class="h-3 w-4/5 bg-background rounded-full"></div>
            </div>
          </div>
          <div class="pt-2 border-t border-background flex items-center gap-2">
            <div class="h-7 w-16 bg-background rounded-xl"></div>
            <div class="h-7 w-16 bg-background rounded-xl"></div>
            <div class="h-7 w-16 bg-background rounded-xl"></div>
          </div>
        </div>

      </div>

    </div>

    <!-- Right sidebar: favorite tags -->
    <div class="w-72 shrink-0 flex flex-col gap-4 overflow-y-auto">

      <div class="card flex flex-col gap-3">
        <h3 class="font-semibold text-primary">Favorite tags</h3>
        <div class="flex flex-col gap-1">
          <button class="flex items-center justify-between px-2 py-1.5 rounded-xl text-sm bg-primary text-white">
            <span class="font-medium">#espresso</span>
            <span class="text-xs text-white/70">8 posts</span>
          </button>
          <button class="flex items-center justify-between px-2 py-1.5 rounded-xl text-sm hover:bg-primary-soft hover:text-primary text-text-primary transition-colors">
            <span class="font-medium">#latte</span>
            <span class="text-xs text-text-secondary">5 posts</span>
          </button>
          <button class="flex items-center justify-between px-2 py-1.5 rounded-xl text-sm hover:bg-primary-soft hover:text-primary text-text-primary transition-colors">
            <span class="font-medium">#arabica</span>
            <span class="text-xs text-text-secondary">3 posts</span>
          </button>
          <button class="flex items-center justify-between px-2 py-1.5 rounded-xl text-sm hover:bg-primary-soft hover:text-primary text-text-primary transition-colors">
            <span class="font-medium">#recipes</span>
            <span class="text-xs text-text-secondary">2 posts</span>
          </button>
        </div>
      </div>

    </div>

  </div>

</div>
