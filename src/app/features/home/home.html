<div class="flex gap-6">

  <div class="flex-1 flex flex-col gap-5 min-w-0">

    <div class="card flex items-center gap-4 py-3 bg-surface p-4 rounded-2xl">
      <svg class="w-5 h-5 shrink-0 text-text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input type="text" placeholder="Rechercher"
        class="bg-transparent outline-none flex-1 placeholder-text-secondary text-text-primary" />
    </div>

    <div class="card">
      <h1 class="text-2xl font-bold text-text-primary">Bonjour, {{ profile()?.username }} 👋</h1>
      <p class="text-text-secondary mt-1">Que voulez-vous découvrir aujourd'hui ?</p>
    </div>

    <div class="grid grid-cols-2 gap-5">
      <div class="card h-64"></div>
      <div class="card h-64"></div>
    </div>

  </div>

  <div class="w-72 shrink-0 flex flex-col gap-4">

    <a routerLink="/profile" class="card flex items-center gap-3 cursor-pointer">
      <div class="w-12 h-12 rounded-full bg-primary-soft flex items-center justify-center text-2xl shrink-0 overflow-hidden">
        @if (profile()?.avatar_url) {
          <img [src]="profile()!.avatar_url" [alt]="profile()!.username" class="w-full h-full object-cover" />
        } @else {
          🐑
        }
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-0.5">
          <span class="font-semibold text-text-primary">{{ profile()?.username }}</span>
          <span class="bg-primary-soft text-primary text-xs font-medium px-2 py-0.5 rounded-full">
            {{ profile()?.badge }}
          </span>
        </div>
        <p class="text-sm text-text-secondary truncate">{{ profile()?.bio || 'Passionné de café ☕' }}</p>
      </div>
      <svg class="w-5 h-5 text-text-secondary shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </a>

    <div class="grid grid-cols-3 gap-3">
      <div class="card h-24"></div>
      <div class="card h-24"></div>
      <div class="card h-24"></div>
    </div>

    <div class="card h-64"></div>

  </div>

</div>
