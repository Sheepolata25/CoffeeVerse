<div class="max-w-xl flex flex-col gap-6">

  <div class="card flex items-center gap-5">
    <div class="w-20 h-20 rounded-full bg-primary-soft flex items-center justify-center text-4xl shrink-0">
      @if (profile()?.avatar_url) {
        <img [src]="profile()!.avatar_url" [alt]="profile()!.username"
          class="w-full h-full rounded-full object-cover" />
      } @else {
        🐑
      }
    </div>
    <div>
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xl font-bold text-text-primary">{{ profile()?.username }}</span>
        <span class="bg-primary-soft text-primary text-xs font-medium px-2 py-0.5 rounded-full">
          {{ profile()?.badge }}
        </span>
      </div>
      <p class="text-text-secondary text-sm">{{ profile()?.bio || 'No bio yet.' }}</p>
    </div>
  </div>

  <div class="card flex flex-col gap-5">
    <h2 class="font-semibold text-text-primary">Update my profile</h2>

    @if (success()) {
      <p class="text-sm text-center bg-success/20 text-green-700 rounded-xl p-3">
        Profile updated!
      </p>
    }
    @if (error()) {
      <p class="text-sm text-center bg-danger/20 text-red-700 rounded-xl p-3">{{ error() }}</p>
    }

    <form class="flex flex-col gap-4" (ngSubmit)="onSubmit()" #f="ngForm">

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-text-primary">Username</label>
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          required
          class="w-full border border-border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary text-text-primary transition" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-text-primary">Bio</label>
        <textarea
          [(ngModel)]="bio"
          name="bio"
          rows="3"
          placeholder="Tell us about your passion for coffee..."
          class="w-full border border-border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary text-text-primary placeholder-text-secondary transition resize-none">
        </textarea>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-text-primary">URL of the avatar</label>
        <input
          type="url"
          [(ngModel)]="avatarUrl"
          name="avatarUrl"
          placeholder="https://..."
          class="w-full border border-border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary text-text-primary placeholder-text-secondary transition" />
      </div>

      <button
        type="submit"
        [disabled]="loading() || !f.valid"
        class="w-full bg-primary text-white font-medium py-3 rounded-xl hover:opacity-90 transition disabled:opacity-50 disabled:cursor-not-allowed">
        {{ loading() ? 'Saving...' : 'Save' }}
      </button>

    </form>
  </div>

  <button
    (click)="signOut()"
    class="text-sm text-text-secondary hover:text-danger transition text-center">
    Log out
  </button>

</div>
