<div class="h-full bg-surface shadow-soft p-6 rounded-2xl flex items-center justify-center">
  <div class="w-full flex flex-col gap-5">

    <div class="flex items-center gap-4 pb-5 border-b border-background">
      <div class="w-16 h-16 rounded-full bg-primary-soft flex items-center justify-center text-3xl shrink-0 overflow-hidden">
        @if (profile()?.avatar_url) {
          <img [src]="profile()!.avatar_url" [alt]="profile()!.username" class="w-full h-full object-cover" />
        } @else {
          👤
        }
      </div>
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="font-bold text-text-primary">{{ profile()?.username }}</span>
          <span class="bg-primary-soft text-primary text-xs font-medium px-2 py-0.5 rounded-full">{{ profile()?.badge }}</span>
        </div>
        <p class="text-text-secondary text-sm">{{ profile()?.bio || 'No bio yet.' }}</p>
      </div>
    </div>

    <h2 class="text-lg font-semibold text-text-primary">Edit Profile</h2>

    @if (success()) {
      <p class="text-sm bg-primary-soft text-primary rounded-xl p-3 text-center">Profile updated!</p>
    }
    @if (error()) {
      <p class="text-sm bg-danger/10 text-danger rounded-xl p-3 text-center">{{ error() }}</p>
    }

    <form class="flex flex-col gap-3" (ngSubmit)="onSubmit()" #f="ngForm">

      <div>
        <label class="block text-xs font-medium text-text-secondary mb-1.5 uppercase tracking-wide">
          Username <span class="text-danger">*</span>
        </label>
        <input type="text" [(ngModel)]="username" name="username" required
          class="w-full bg-background rounded-xl px-3 py-2.5 text-sm text-text-primary outline-none border border-transparent focus:border-primary transition-colors" />
      </div>

      <div>
        <label class="block text-xs font-medium text-text-secondary mb-1.5 uppercase tracking-wide">Bio</label>
        <textarea [(ngModel)]="bio" name="bio" rows="3"
          placeholder="Tell us about your passion for coffee..."
          class="w-full bg-background rounded-xl px-3 py-2.5 text-sm text-text-primary placeholder-text-secondary outline-none border border-transparent focus:border-primary transition-colors resize-none"></textarea>
      </div>

      <div>
        <label class="block text-xs font-medium text-text-secondary mb-1.5 uppercase tracking-wide">Avatar URL</label>
        <input type="url" [(ngModel)]="avatarUrl" name="avatarUrl"
          placeholder="https://..."
          class="w-full bg-background rounded-xl px-3 py-2.5 text-sm text-text-primary placeholder-text-secondary outline-none border border-transparent focus:border-primary transition-colors" />
      </div>

      <button type="submit" [disabled]="loading() || !f.valid"
        class="w-full bg-primary text-white font-medium py-2.5 rounded-xl hover:bg-primary/90 disabled:opacity-50 disabled:cursor-not-allowed transition-colors mt-1">
        {{ loading() ? 'Saving...' : 'Save' }}
      </button>

    </form>

  </div>
</div>
