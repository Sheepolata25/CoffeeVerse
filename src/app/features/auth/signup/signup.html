<div class="min-h-screen bg-background flex items-center justify-center p-6">
  <div class="card w-full max-w-md flex flex-col gap-6">

    <div class="text-center">
      <h1 class="text-3xl font-bold">
        <span class="text-text-primary">Coffee</span><span class="text-coffee">Verse</span>
      </h1>
      <p class="text-text-secondary mt-1">Rejoins la communauté !</p>
    </div>

    @if (error()) {
      <p class="text-sm text-center text-danger bg-danger/10 rounded-xl p-3">{{ error() }}</p>
    }

    <form class="flex flex-col gap-4" (ngSubmit)="onSubmit()" #f="ngForm">

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-text-primary">Nom d'utilisateur</label>
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          required
          placeholder="Sheepolata"
          class="w-full border border-border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary text-text-primary placeholder-text-secondary transition" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-text-primary">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="ton@email.com"
          class="w-full border border-border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary text-text-primary placeholder-text-secondary transition" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-text-primary">Mot de passe</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          minlength="6"
          placeholder="••••••••"
          class="w-full border border-border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary text-text-primary placeholder-text-secondary transition" />
      </div>

      <button
        type="submit"
        [disabled]="loading() || !f.valid"
        class="w-full bg-primary text-white font-medium py-3 rounded-xl hover:opacity-90 transition disabled:opacity-50 disabled:cursor-not-allowed mt-2">
        {{ loading() ? 'Inscription...' : 'Créer mon compte' }}
      </button>

    </form>

    <p class="text-center text-sm text-text-secondary">
      Déjà un compte ?
      <a routerLink="/login" class="text-primary font-medium hover:underline">Se connecter</a>
    </p>

  </div>
</div>
