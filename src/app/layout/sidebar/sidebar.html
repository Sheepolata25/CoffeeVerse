<div class="w-64 bg-surface h-full shadow-soft flex flex-col p-4 rounded-2xl">

  <div class="mb-8 text-center">
    <div class="text-3xl font-bold">
      <span class="text-text-primary">Coffee</span><span class="text-primary-light">Verse</span>
    </div>
    @if (isAdmin()) {
      <span class="text-xs font-medium text-primary tracking-wide">Admin version</span>
    }
  </div>

  <nav class="flex flex-col gap-2">

    <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="bg-primary-soft text-primary font-medium"
      class="flex items-center gap-3 p-3 rounded-xl hover:bg-primary-soft text-text-secondary transition-colors">
      <svg class="w-5 h-5 shrink-0 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span>Home</span>
    </a>

    <a routerLink="/posts" routerLinkActive="bg-primary-soft text-primary font-medium"
      class="flex items-center gap-3 p-3 rounded-xl hover:bg-primary-soft text-text-secondary transition-colors">
      <svg class="w-5 h-5 shrink-0 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <span>My posts</span>
    </a>

    <a routerLink="/community" routerLinkActive="bg-primary-soft text-primary font-medium"
      class="flex items-center gap-3 p-3 rounded-xl hover:bg-primary-soft text-text-secondary transition-colors">
      <svg class="w-5 h-5 shrink-0 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
      </svg>
      <span>Community</span>
    </a>

    <a routerLink="/favorites" routerLinkActive="bg-primary-soft text-primary font-medium"
      class="flex items-center gap-3 p-3 rounded-xl hover:bg-primary-soft text-text-secondary transition-colors">
      <svg class="w-5 h-5 shrink-0 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
      </svg>
      <span>Favorites</span>
    </a>

    <a routerLink="/map" routerLinkActive="bg-primary-soft text-primary font-medium"
      class="flex items-center gap-3 p-3 rounded-xl hover:bg-primary-soft text-text-secondary transition-colors">
      <svg class="w-5 h-5 shrink-0 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
      </svg>
      <span>Map</span>
    </a>

    <a routerLink="/profile" routerLinkActive="bg-primary-soft text-primary font-medium"
      class="flex items-center gap-3 p-3 rounded-xl hover:bg-primary-soft text-text-secondary transition-colors">
      <svg class="w-5 h-5 shrink-0 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      <span>Profile</span>
    </a>

  </nav>

  <div class="mt-auto">
    <button (click)="signOut()"
      class="flex items-center gap-3 w-full p-3 rounded-xl text-text-secondary hover:bg-danger/10 hover:text-danger transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span>Log out</span>
    </button>
  </div>

</div>
